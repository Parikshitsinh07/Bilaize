<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicont.PNG" />
    <link rel="apple-touch-icon" href="/favicont.PNG" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@100..900&family=Spectral:ital,wght@0,300..800;1,300..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRIELITE</title>

    <!-- ═══════════════════════════════════════════════════════════
         PRE-REACT SPLASH — shows instantly, before any JS loads.
         Removed by main.jsx once React has mounted.
         ═══════════════════════════════════════════════════════════ -->
    <style>
      /* Hard reset so splash fills perfectly */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 100%; height: 100%; overflow: hidden; }

      /* ── Splash shell ── */
      #pre-splash {
        position: fixed;
        inset: 0;
        background: #b22222;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        /* No transition — JS removes this element instantly when React mounts */
      }

      #pre-splash.hide {
        display: none;
      }

      /* ── Logo SVG wrapper ── */
      #pre-splash .ps-logo {
        width: min(860px, 88vw);
        animation: ps-float 3s ease-in-out infinite;
      }

      @keyframes ps-float {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-10px); }
      }

      /* ── SVG text styles (mirror SplashScreen.css) ── */
      .ps-text-bg {
        fill: rgba(255, 255, 255, 0.15);  /* white ghost on red */
        font-size: 180px;
        font-weight: 900;
        letter-spacing: 10px;
        font-family: Arial, sans-serif;
      }

      .ps-text-mask {
        fill: white;
        font-size: 180px;
        font-weight: 900;
        letter-spacing: 10px;
        font-family: Arial, sans-serif;
      }

      /* ── White fill rises on red background ── */
      .ps-fill { fill: #ffffff; }
      .ps-wave { fill: #ffffff; }

      /* ── Animated fill rising ── */
      .ps-rise {
        animation: ps-rise 2.3s ease-in-out forwards;
      }

      @keyframes ps-rise {
        from { transform: translateY(0px); }
        to   { transform: translateY(-750px); }
      }

      /* ── Loading bar at bottom ── */
      #pre-splash .ps-bar-wrap {
        margin-top: 60px;
        width: min(340px, 70vw);
        height: 2px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        overflow: hidden;
      }

      #pre-splash .ps-bar {
        height: 100%;
        width: 0%;
        background: #ffffff;          /* white bar on red bg */
        border-radius: 2px;
        animation: ps-load 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes ps-load {
        0%   { width: 0%; }
        40%  { width: 55%; }
        70%  { width: 78%; }
        90%  { width: 92%; }
        100% { width: 100%; }
      }

      /* ── Noise texture overlay ── */
      #pre-splash .ps-noise {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        background-image: radial-gradient(rgba(0,0,0,0.4) 1px, transparent 1px);
        background-size: 4px 4px;
        animation: ps-noise 10s linear infinite;
        pointer-events: none;
      }

      @keyframes ps-noise {
        from { transform: translate(0, 0); }
        to   { transform: translate(-150px, -150px); }
      }
    </style>
  </head>

  <body>
    <!-- ── Pre-React splash (visible before JS hydrates) ── -->
    <div id="pre-splash" role="status" aria-label="Loading Brielite">
      <div class="ps-noise"></div>

      <svg viewBox="0 0 1200 500" class="ps-logo" aria-hidden="true">
        <defs>
          <mask id="ps-mask">
            <rect width="100%" height="100%" fill="black" />
            <text x="50%" y="50%" dominant-baseline="middle"
                  text-anchor="middle" class="ps-text-mask">BRIELITE</text>
          </mask>
        </defs>

        <!-- Outline text -->
        <text x="50%" y="55%" text-anchor="middle" class="ps-text-bg">BRIELITE</text>

        <!-- Rising red fill -->
        <g mask="url(#ps-mask)">
          <rect class="ps-fill ps-rise" x="-200" y="500" width="1600" height="1000" />
          <path class="ps-wave ps-rise"
            d="M0 180 C150 140 300 220 450 180 C600 140 750 220 900 180
               C1050 140 1200 220 1350 180 L1350 500 L0 500 Z" />
        </g>
      </svg>

      <!-- Progress bar -->
      <div class="ps-bar-wrap">
        <div class="ps-bar"></div>
      </div>
    </div>

    <!-- ── React mounts here ── -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
